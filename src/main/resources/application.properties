server.port=8081
spring.application.name=ms-medicos

# 🔐 Validación de Tokens Microsoft Entra ID (OAuth2)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/12d06913-6cce-486f-a7a4-d6202dc5bf6a/v2.0

# ☁️ Base de Datos AWS RDS (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:medictime-db.c9as0s46goqj.us-east-1.rds.amazonaws.com}:3306/${DB_NAME:medictime}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:MedicTime2026!}

# 🛠️ JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 🐰 Configuración de RabbitMQ para AWS EC2
spring.rabbitmq.host=${RABBITMQ_HOST:172.31.18.209}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:MedicTime2026!}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# 🚀 Configuración de Apache Kafka (AWS EC2 Cluster - 3 Brokers)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:172.31.16.86:9092,172.31.16.86:9093,172.31.16.86:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.spring.json.add.type.headers=false

# 📌 Tópicos de negocio MEDICTIME
medictime.kafka.topic.medicos=${KAFKA_TOPIC_MEDICOS:medictime.medicos.eventos}
medictime.kafka.topic.auditoria=${KAFKA_TOPIC_AUDITORIA:medictime.auditoria.trazabilidad}


# 📝 Logs de depuración
logging.level.com.medictime.medicos=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# ⚠️ Manejo de errores HTTP
server.error.whitelabel.enabled=false
server.error.include-message=always